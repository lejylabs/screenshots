name: Owned Windows receiver exact regressions
on:
  push:
    branches: [feat/windows-native-drop-probe]
permissions:
  contents: read
jobs:
  receiver-regressions:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: production-drop-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            Windows-cargo-
      - uses: actions/cache/restore@v4
        with:
          path: target/release-fast
          key: receiver-regression-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            production-drop-instrumented-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            production-drop-instrumented-${{ runner.os }}-
      - name: Execute exact two deadline and two broker regressions
        shell: pwsh
        run: |
          $env:RUSTFLAGS='--cfg screenshots_native_drop_acceptance --check-cfg=cfg(screenshots_native_drop_acceptance)'
          New-Item -ItemType Directory target/receiver-regression-proof -Force | Out-Null
          $Cases=@('native_drop_deadline::tests::retiring_active_receiver_keeps_its_cutoff_through_done_stop_and_exit','native_drop_deadline::tests::retiring_idle_receiver_gets_one_finite_nonrenewing_exit_budget','native_drop_broker::tests::cancel_between_packet_sample_and_done_keeps_the_active_cutoff','native_drop_broker::tests::receiver_eof_is_distinct_from_partial_or_corrupt_trailing_packets')
          foreach ($Case in $Cases) {
            $Listed=@(cargo test --locked --profile release-fast -p gpui-pre-windows --lib -j 2 $Case -- --exact --list)
            if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
            if (@($Listed | Where-Object {$_.Trim() -eq ($Case+': test')}).Count -ne 1) {throw ('Exact native regression missing: '+$Case)}
            $Name=$Case.Split(':')[-1]
            cargo test --locked --profile release-fast -p gpui-pre-windows --lib -j 2 $Case -- --exact --test-threads=1 --nocapture 2>&1 | Tee-Object -FilePath ('target/receiver-regression-proof/'+$Name+'.log')
            if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          [ordered]@{source_commit=$env:GITHUB_SHA;selected_exact=4;passed=4;scope='Actual production helper bodies on native Windows; no general clipboard/input'} | ConvertTo-Json | Set-Content target/receiver-regression-proof/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-windows-receiver-regressions
          path: target/receiver-regression-proof
          retention-days: 7
          if-no-files-found: error
