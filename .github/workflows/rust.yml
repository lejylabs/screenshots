name: Owned synthetic CoreGraphics HDR diagnostic
on:
  push:
    branches: [feat/macos-hdr-diagnostic]
permissions:
  contents: read
jobs:
  native-color:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual SDK tone-mapping contract
        run: |
          header="$(xcrun --show-sdk-path)/System/Library/Frameworks/CoreGraphics.framework/Headers/CGContext.h"
          sed -n '/Set target EDR headroom/,/CGContextDrawTiledImage/p' "$header"
          cat "$(xcrun --show-sdk-path)/System/Library/Frameworks/CoreGraphics.framework/Headers/CGToneMapping.h"
      - name: Run owned synthetic floating bitmap cases
        run: |
          clang -Wall -Wextra -Werror -framework CoreGraphics scripts/mac-native-diagnostic.c -o /tmp/mac-native-diagnostic
          /tmp/mac-native-diagnostic
