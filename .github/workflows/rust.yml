name: Owned Windows production drop runtime probe
on:
  push:
    branches: [feat/windows-native-drop-probe]
  workflow_dispatch:
    inputs:
      owned_input_desktop:
        description: 'Permit synthetic mouse input only on this disposable hosted VM owned desktop'
        type: boolean
        default: false
env:
  CARGO_BUILD_JOBS: "2"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
permissions:
  contents: read
jobs:
  production-drop:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Use repository-pinned Rust
        run: rustup show active-toolchain
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: production-drop-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            Windows-cargo-
      - uses: actions/cache/restore@v4
        id: native_dependencies
        with:
          path: |
            target/vcpkg-installed
            target/vcpkg-downloads
          key: native-sftp-x86_64-pc-windows-msvc-${{ hashFiles('packaging/windows/vcpkg.json') }}
      - name: Build pinned native engine dependencies
        shell: pwsh
        run: |
          if (!(Test-Path target/vcpkg-installed/x64-windows-static-md/lib/libcurl.lib)) {
            git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git target/vcpkg
            if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
            git -C target/vcpkg checkout 8f363bdc11359ede4bc51e5eb32a2617538049c8
            if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
            & target/vcpkg/bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
            $env:VCPKG_DOWNLOADS=Join-Path $PWD 'target/vcpkg-downloads'
            & target/vcpkg/vcpkg.exe install --triplet x64-windows-static-md --x-manifest-root=packaging/windows --x-install-root=target/vcpkg-installed --disable-metrics
            if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          } else {
            New-Item -ItemType Directory target/vcpkg -Force | Out-Null
            New-Item -ItemType File target/vcpkg/.vcpkg-root -Force | Out-Null
          }
          New-Item -ItemType Junction -Path (Join-Path $PWD 'target/vcpkg/installed') -Target (Join-Path $PWD 'target/vcpkg-installed') | Out-Null
          "VCPKG_ROOT=$(Join-Path $PWD 'target/vcpkg')" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          'SCREENSHOTS_REQUIRE_NATIVE_CURL=1' >> $env:GITHUB_ENV
      - uses: actions/cache/save@v4
        if: ${{ steps.native_dependencies.outputs.cache-hit != 'true' }}
        with:
          path: |
            target/vcpkg-installed
            target/vcpkg-downloads
          key: native-sftp-x86_64-pc-windows-msvc-${{ hashFiles('packaging/windows/vcpkg.json') }}
      - uses: actions/cache/restore@v4
        id: application_cache
        with:
          path: target/release-fast
          key: production-drop-instrumented-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            production-drop-instrumented-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            production-drop-instrumented-${{ runner.os }}-
      - name: Build existing private SXCU runtime
        shell: pwsh
        run: |
          python scripts/build-sharex-helper.py --rid win-x64
          New-Item -ItemType Directory -Force target/release-fast/lib | Out-Null
          Copy-Item -Recurse target/sharex-helper/publish/win-x64 target/release-fast/lib/screenshots-sxcu
      - name: Build actual instrumented application
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '--cfg screenshots_native_drop_acceptance --check-cfg=cfg(screenshots_native_drop_acceptance)'
          cargo build --locked --profile release-fast -p screenshots
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Run actual installed spawner/helper/native/editor acceptance
        shell: pwsh
        run: |
          $Parameters = @{Application=(Resolve-Path target/release-fast/screenshots.exe).Path; OutputDirectory=(Join-Path $PWD 'target/production-drop-results')}
          if ('true' -eq 'true') {$Parameters.OwnedHostedCiInputDesktop=$true}
          & ./verification/windows-production-native-fixture/run.ps1 @Parameters
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.application_cache.outputs.cache-hit != 'true' }}
        with:
          path: target/release-fast
          key: production-drop-instrumented-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-windows-production-drop-proof
          path: target/production-drop-results
          if-no-files-found: error
