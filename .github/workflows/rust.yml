name: Private Windows OLE receiver topology
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-drop-topology-${{ github.ref }}
  cancel-in-progress: true
jobs:
  topology:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enter installed x64 MSVC environment
        shell: pwsh
        run: |
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $VsPath = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$VsPath) { throw 'Installed MSVC compiler unavailable' }
          & (Join-Path $VsPath 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment failed' }
          & tools/WindowsDropTopology/run_probe.ps1 -OutputDirectory (Join-Path $PWD 'target/drop-topology-proof') -OwnedHostedCiInputDesktop
      - name: Preserve exact probe source and every result including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-drop-topology-proof
          path: |
            target/drop-topology-proof/
            tools/WindowsDropTopology/
