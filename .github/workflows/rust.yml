name: Owned Windows 2022 native ownership controls only
on:
  push:
    branches: [feat/windows-native-drop-probe]
permissions:
  contents: read
jobs:
  native-preflight-only:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile exact native boundary with read-only return mode
        shell: pwsh
        run: |
          New-Item -ItemType Directory target/preflight-only-proof -Force | Out-Null
          & cl.exe /nologo /std:c++20 /EHsc /W4 /O2 /D_WIN32_WINNT=0x0A00 verification/windows-spool-native-fixture/preflight_only_controller.cpp /Fe:target/preflight-only-proof/controller.exe /Fo:target/preflight-only-proof/controller.obj winspool.lib user32.lib gdi32.lib advapi32.lib ole32.lib
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Execute original preflight ownership controls and cleanup only
        shell: pwsh
        timeout-minutes: 3
        run: |
          $Script=(Resolve-Path verification/windows-spool-native-fixture/run.ps1).Path
          $Fixture=& "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -STA -File $Script -Stage Prepare | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          $Controller=(Resolve-Path target/preflight-only-proof/controller.exe).Path
          $ExistenceOnlyOne=(Resolve-Path "$env:SystemRoot\System32\cmd.exe").Path
          $ExistenceOnlyTwo=(Resolve-Path "$env:SystemRoot\System32\where.exe").Path
          # These distinct paths are resolved ONLY by Stage Preflight; neither is executed.
          & $Controller ownership-only $Script $Fixture.directory $ExistenceOnlyOne $ExistenceOnlyTwo 2>&1 | Tee-Object -FilePath target/preflight-only-proof/controller.log
          $Code=$LASTEXITCODE
          Get-ChildItem -LiteralPath $Fixture.directory -File | Where-Object {$_.Extension -in @('.log','.txt') -and $_.Length -le 4194304} | ForEach-Object {Copy-Item -LiteralPath $_.FullName -Destination (Join-Path target/preflight-only-proof $_.Name)}
          [ordered]@{source_commit=$env:GITHUB_SHA;scope='ownership-controls-only';product_executed=$false;controller_exit=$Code} | ConvertTo-Json | Set-Content target/preflight-only-proof/scope.json
          if ($Code -ne 0) {exit $Code}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-native-spool-ownership-only
          path: target/preflight-only-proof
          retention-days: 7
          if-no-files-found: error
