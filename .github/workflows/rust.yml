name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config libssl-dev \
            libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev \
            libx11-dev libxrandr-dev libxfixes-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libegl1-mesa-dev libgbm-dev libdrm-dev \
            libpipewire-0.3-dev
      - name: Verify tray build dependencies
        run: pkg-config --exists 'glib-2.0 >= 2.56' 'gtk+-3.0 >= 3.22' ayatana-appindicator3-0.1
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-1.99-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-1.99-
      - name: Build
        run: cargo +1.99.0 build --workspace
      - name: Run tests
        run: cargo +1.99.0 test --workspace
