name: Owned Windows native drop compile probe
on:
  push:
    branches: [feat/windows-native-drop-probe]
permissions:
  contents: read
jobs:
  native-compile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Parse actual owned controller PowerShell
        shell: pwsh
        run: |
          $Tokens=$null; $Errors=$null
          $null=[System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'verification/windows-production-native-fixture/run.ps1'),[ref]$Tokens,[ref]$Errors)
          if ($Errors.Count) {$Errors | Format-List; throw 'Actual fixture PowerShell parser rejected source'}
      - name: Compile actual source DLL and outer controller
        shell: pwsh
        run: |
          New-Item -ItemType Directory target/native-drop-compile -Force | Out-Null
          $Native=Join-Path $PWD 'verification/windows-production-native-fixture/native'
          foreach ($Name in @('production_source','production_bridge','production_controller')) {
            $Arguments=@('/nologo','/std:c++20','/EHsc','/W4','/O2','/D_WIN32_WINNT=0x0A00',(Join-Path $Native "$Name.cpp"),"/Fe:target/native-drop-compile/$Name.exe","/Fo:target/native-drop-compile/$Name.obj",'ole32.lib','oleaut32.lib','user32.lib','psapi.lib','rpcrt4.lib','shell32.lib','uuid.lib')
            if ($Name -eq 'production_bridge') {$Arguments += '/LD'}
            & cl.exe @Arguments
            if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
