name: Owned Windows 2022 read-only AddPrinter API prerequisites
on:
  push:
    branches: [feat/windows-native-drop-probe]
permissions:
  contents: read
jobs:
  api-prerequisites-readonly:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile same native controller with read-only observation mode
        shell: pwsh
        run: |
          New-Item -ItemType Directory target/api-prerequisite-proof -Force | Out-Null
          & cl.exe /nologo /std:c++20 /EHsc /W4 /O2 /D_WIN32_WINNT=0x0A00 verification/windows-spool-native-fixture/api_prerequisites_controller.cpp /Fe:target/api-prerequisite-proof/controller.exe /Fo:target/api-prerequisite-proof/controller.obj winspool.lib user32.lib gdi32.lib advapi32.lib ole32.lib
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Observe actual token privilege and installed processor/datatype without adjustment
        shell: pwsh
        timeout-minutes: 2
        run: |
          & ./target/api-prerequisite-proof/controller.exe prerequisites-only 2>&1 | Tee-Object -FilePath target/api-prerequisite-proof/result.json
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-AddPrinter-api-prerequisites-readonly
          path: target/api-prerequisite-proof
          retention-days: 7
          if-no-files-found: error
