name: Dependency policy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-dependency-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: "2"
      SCREENSHOTS_RUST_TOOLCHAIN: "1.100.0"
      SCREENSHOTS_DENY_VERSION: "0.20.2"
      SCREENSHOTS_DENY_SOURCE_SHA256: e528dfcbe739af7ce37a77d3d6df1b29dd6887b1c701d888820c0f16b864f737
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scope policy tools outside the application workspace
        shell: bash
        run: |
          echo "SCREENSHOTS_DENY_ROOT=$RUNNER_TEMP/screenshots-cargo-deny" >> "$GITHUB_ENV"
          echo "SCREENSHOTS_DENY_SOURCE=$RUNNER_TEMP/screenshots-cargo-deny-source" >> "$GITHUB_ENV"
          echo "SCREENSHOTS_POLICY_EVIDENCE=$RUNNER_TEMP/screenshots-dependency-policy-evidence" >> "$GITHUB_ENV"
      - name: Install exact Rust and cargo-deny from verified registry source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCREENSHOTS_POLICY_EVIDENCE"
          rustup toolchain install "$SCREENSHOTS_RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustc +"$SCREENSHOTS_RUST_TOOLCHAIN" --version --verbose | tee "$SCREENSHOTS_POLICY_EVIDENCE/rustc.txt"
          cargo xtask ci fetch-crate-source cargo-deny "$SCREENSHOTS_DENY_VERSION" "$SCREENSHOTS_DENY_SOURCE_SHA256" "$SCREENSHOTS_DENY_SOURCE"
          cargo +"$SCREENSHOTS_RUST_TOOLCHAIN" install --locked \
            --path "$SCREENSHOTS_DENY_SOURCE/cargo-deny-$SCREENSHOTS_DENY_VERSION" --root "$SCREENSHOTS_DENY_ROOT" \
            2>&1 | tee "$SCREENSHOTS_POLICY_EVIDENCE/tool-install.log"
          cargo xtask ci deny-provenance
      - name: Check registry advisories and actual-source licenses
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: "1.100.0"
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --locked > "$SCREENSHOTS_POLICY_EVIDENCE/actual-metadata.json"
          "$SCREENSHOTS_DENY_ROOT/bin/cargo-deny" --locked --workspace --exclude-dev --config deny.toml \
            --metadata-path "$SCREENSHOTS_POLICY_EVIDENCE/actual-metadata.json" \
            check advisories licenses 2>&1 | tee "$SCREENSHOTS_POLICY_EVIDENCE/registry-and-licenses.log"
          "$SCREENSHOTS_DENY_ROOT/bin/cargo-deny" --locked --workspace --exclude-dev --config deny.toml \
            --metadata-path "$SCREENSHOTS_POLICY_EVIDENCE/actual-metadata.json" \
            list --format json --layout crate --threshold 0.93 > "$SCREENSHOTS_POLICY_EVIDENCE/actual-selected.json"
      - name: Check verified vendored published-base advisory identities
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: "1.100.0"
          SCREENSHOTS_POLICY_TEST_ROOT: ${{ runner.temp }}/screenshots-dependency-policy-controls
        run: |
          set -euo pipefail
          cargo test --locked -p xtask advisory:: 2>&1 | tee "$SCREENSHOTS_POLICY_EVIDENCE/provenance-controls.log"
          cargo xtask vendored-advisory-view prepare \
            --metadata "$SCREENSHOTS_POLICY_EVIDENCE/actual-metadata.json" \
            --selected "$SCREENSHOTS_POLICY_EVIDENCE/actual-selected.json" \
            --provenance config/vendored-upstream-advisories.json --root "$PWD" --policy deny.toml \
            --advisory-db-root target/dependency-audit/advisory-dbs \
            --output "$SCREENSHOTS_POLICY_EVIDENCE/upstream-view"
          "$SCREENSHOTS_DENY_ROOT/bin/cargo-deny" --offline --locked --workspace --exclude-dev \
            --config "$SCREENSHOTS_POLICY_EVIDENCE/upstream-view/upstream-advisory-policy.toml" \
            --metadata-path "$SCREENSHOTS_POLICY_EVIDENCE/upstream-view/upstream-advisory-only-view.json" \
            list --format json --layout crate --threshold 0.93 > "$SCREENSHOTS_POLICY_EVIDENCE/projected-selected.json"
          cargo xtask vendored-advisory-view verify-selection \
            "$SCREENSHOTS_POLICY_EVIDENCE/actual-selected.json" "$SCREENSHOTS_POLICY_EVIDENCE/projected-selected.json"
          "$SCREENSHOTS_DENY_ROOT/bin/cargo-deny" --offline --locked --workspace --exclude-dev \
            --config "$SCREENSHOTS_POLICY_EVIDENCE/upstream-view/upstream-advisory-policy.toml" \
            --metadata-path "$SCREENSHOTS_POLICY_EVIDENCE/upstream-view/upstream-advisory-only-view.json" \
            check advisories 2>&1 | tee "$SCREENSHOTS_POLICY_EVIDENCE/vendored-upstream-advisories.log"
      - name: Prove actual engine advisory and license rejection controls
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: "1.100.0"
        run: |
          set -euo pipefail
          cargo xtask dependency-policy-controls \
            --tool "$SCREENSHOTS_DENY_ROOT/bin/cargo-deny" \
            --evidence "$SCREENSHOTS_POLICY_EVIDENCE" --policy deny.toml \
            --advisory-db-root target/dependency-audit/advisory-dbs \
            2>&1 | tee "$SCREENSHOTS_POLICY_EVIDENCE/engine-controls.log"
          touch "$SCREENSHOTS_POLICY_EVIDENCE/check-succeeded"
      - name: Record exact advisory and lockfile provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCREENSHOTS_POLICY_EVIDENCE"
          cargo xtask ci advisory-snapshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-policy-evidence
          path: ${{ env.SCREENSHOTS_POLICY_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
