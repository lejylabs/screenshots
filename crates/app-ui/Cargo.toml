[package]
name = "app-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "GPUI views and windows. No capture or database implementation."

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
app-core.workspace = true
image.workspace = true
gpui-kit.workspace = true
shared.workspace = true
tracing.workspace = true
unicode-segmentation = "1"

[dev-dependencies]
raw-window-handle = "0.6.2"
gpui-kit = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse"] }
tracing-subscriber.workspace = true
