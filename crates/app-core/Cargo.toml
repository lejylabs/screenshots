[package]
name = "app-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Application core. No GPUI dependency."

[lints]
workspace = true

[dependencies]
unicode-normalization = "=0.1.26"
harfrust = "=0.15.0"
skrifa = "=0.49.0"
unicode-bidi = "=0.3.18"
unicode-script = "=0.5.9"
unicode-segmentation = "=1.13.3"
unicode-linebreak = "=0.1.5"
anyhow.workspace = true
base64.workspace = true
arboard.workspace = true
chrono.workspace = true
crc32fast = "1.5.0"
directories.workspace = true
image.workspace = true
gif = "=0.14.2"
hmac = "=0.12.1"
sha2_10 = { package = "sha2", version = "=0.10.9" }
libwebp-sys = { version = "=0.14.4", default-features = false }
regex.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde.workspace = true
serde_json.workspace = true
shared.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
tiff = "=0.11.3"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true
xcap.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "=4.1.0", default-features = false }
x11rb = { version = "=0.13.2", default-features = false, features = ["randr", "xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSArray", "NSDictionary", "NSBundle", "NSError", "NSObjCRuntime", "NSValue"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "objc2", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGImage", "CGGeometry", "CGColorSpace"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "objc2-core-media", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureVideoDataOutput"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "objc2", "objc2-core-video", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "=2.17.0"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
global-hotkey.workspace = true
tray-icon.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_DataExchange", "Win32_System_Memory"] }
