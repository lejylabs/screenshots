[package]
name = "app-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Application core. No GPUI dependency."

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
arboard.workspace = true
chrono.workspace = true
directories.workspace = true
image.workspace = true
hmac = "=0.12.1"
sha2_10 = { package = "sha2", version = "=0.10.9" }
libwebp-sys = { version = "=0.14.4", default-features = false }
regex.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde.workspace = true
serde_json.workspace = true
shared.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true
xcap.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "=4.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "=2.17.0"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
global-hotkey.workspace = true
tray-icon.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_DataExchange", "Win32_System_Memory"] }
