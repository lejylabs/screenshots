[package]
name = "screenshots"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Desktop capture and sharing application"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
app-core.workspace = true
app-ui.workspace = true
arboard.workspace = true
global-hotkey.workspace = true
rfd.workspace = true
shared.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
image.workspace = true
zeroize.workspace = true
qrcode = { version = "=0.14.1", default-features = false }
quircs = "=0.10.3"
sha2 = "0.11.0"
crc32fast = "1.5.0"

[target.'cfg(unix)'.dependencies]
signal-hook = "=0.3.18"
libc = "0.2.191"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }
